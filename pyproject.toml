[project]
name = "ozzgraph"
version = "2.1.0"
description = "Model-adaptive autonomous CTF agent harness for authorized, isolated environments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    # V08 (v2/local-assessment): scope + credentials files may be YAML
    # (OZZGRAPH_SCOPE_FILE / OZZGRAPH_CREDENTIALS_FILE). JSON and TOML are
    # stdlib; YAML needs the safe loader.
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyright>=1.1.411",
    # Stubs for the pyyaml runtime dependency (mypy strict).
    "types-PyYAML>=6.0",
]

[project.scripts]
halctl = "ozzgraph.halctl:main"
ozzgraph = "ozzgraph.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ozzgraph"]
# V05: the per-model profile TOML files under src/ozzgraph/profile_data/
# ship with the wheel (hatchling includes all files under `packages`),
# so a wheel install resolves them exactly like an editable checkout
# (profiles.default_profile_dir()).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
