# OzzGraph model profile: Google Gemma family (V05 data-driven profiles).
# ``google/gemma-*-it:free`` endpoints are reliable free-tier models behind
# OpenRouter's free alias and follow a strict JSON output contract. Like the
# openrouter profile, this declares the JSON protocol ONLY so the harness
# compiles JSON-format prompts the model actually follows (declaring
# ``terminal`` would degrade its JSON replies to ``think``). Verified against
# OWASP Juice Shop 2026-08-11: the model returns exactly
# ``{"kind": "run", "payload": "curl -v ..."}`` on repeat attempts.
# ``model_ids`` lists concrete ids this family profile covers;
# family-prefix matching covers the rest of the line.
# Benchmarks are placeholders — all-zero means "not yet measured";
# ProfileStore.update_benchmarks() persists measured harness metrics here.
family = "gemma"
model_ids = ["google/gemma-4-26b-a4b-it:free", "google/gemma-4-31b-it:free"]
protocols = ["json"]
context_soft_limit = 32000
output_token_limit = 2048
temperature = 0.2
supported_roles = ["system", "user", "assistant"]
max_advertised_skills = 4
failure_behavior = "repair_retry"
confidence = 0.7

[benchmarks.json]
valid_output_rate = 0.0
correct_tool_selection = 0.0
repetition_rate = 0.0
recovery_rate = 0.0
output_tokens_per_decision = 0.0
steps_per_objective = 0.0
solve_rate = 0.0
unsupported_fact_rate = 0.0
unsupported_flag_rate = 0.0
