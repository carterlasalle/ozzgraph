# OzzGraph model profile: DeepSeek family (V05 data-driven profiles).
# ``model_ids`` lists concrete ids this family profile covers (exact-id
# discovery evidence); family-prefix matching covers the rest of the line.
# Benchmarks are placeholders — all-zero means "not yet measured";
# ProfileStore.update_benchmarks() persists measured harness metrics here.
family = "deepseek"
model_ids = ["deepseek-chat", "deepseek-coder", "deepseek-v4-flash-0731", "deepseek-v4"]
protocols = ["json", "terminal", "three_line"]
context_soft_limit = 64000
output_token_limit = 4096
temperature = 0.2
supported_roles = ["system", "user", "assistant"]
max_advertised_skills = 8
failure_behavior = "repair_retry"
confidence = 0.9

